      property="og:description"
      content="Accessible primitives built on Base UI. Fully typed APIs. Themable tokens and layout components."
    />
    <meta property="og:url" content="https://skeletal.vikram.wiki/" />

      rel="stylesheet"
    />

  <body>
    <script>
      (function () {
        var stored = localStorage.getItem("skeletal:theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.classList.add(stored);
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
