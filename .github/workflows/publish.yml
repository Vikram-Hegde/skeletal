name: Publish to npm

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Prevent publish from running on forks
    if: github.repository == 'Vikram-Hegde/skeletal'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify package
        run: npm pack --dry-run

      # OIDC Trusted Publisher: no NPM_TOKEN needed.
      # Configure once at https://www.npmjs.com/package/@vikram-hegde/skeletal/access
      # or https://www.npmjs.com/settings/[your-org]/access -> Trusted Publishers
      # Publisher: GitHub Actions, repo: Vikram-Hegde/skeletal, workflow: publish.yml
      - name: Publish to npm (OIDC provenance)
        run: npm publish --access public --provenance
